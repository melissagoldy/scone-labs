<template>
    <section class="hub" aria-label="Scone Labs fitness">
        <header class="hero"><div><span class="eyebrow">SCONE LABS · MOVE WITH PURPOSE</span><h1>Small steps. Stronger you.</h1><p>Your pace. Your progress. One good set at a time.</p></div><span class="hero-icon" aria-hidden="true">✦</span></header>
        <template lwc:if={busy}><lightning-spinner alternative-text="Loading or saving workout" size="small"></lightning-spinner></template>
        <template lwc:if={error}><div class="message error" role="alert">{error}</div></template>
        <template lwc:if={notice}><div class="message success" role="status">{notice}</div></template>
        <template lwc:if={homeVisible}>
            <template lwc:if={hasUnfinished}><section class="panel"><span class="eyebrow">PICK UP WHERE YOU LEFT OFF</span><h2>Ready to return?</h2><div class="cards"><template for:each={unfinished} for:item="s"><button class="routine resume" key={s.Id} data-id={s.Id} onclick={openSession} disabled={busy}><strong>{s.title}</strong><span>{s.subtitle}</span><span class="link-label">Resume workout →</span></button></template></div></section></template>
            <section class="panel"><span class="eyebrow">TODAY IS A GOOD DAY TO START</span><h2>Choose your workout</h2><div class="cards"><template for:each={templates} for:item="t"><button key={t.Id} class="routine" data-id={t.Id} onclick={chooseTemplate} disabled={busy}><strong>{t.Name}</strong><span>{t.description}</span><span class="link-label">View routine →</span></button></template></div>
                <template lwc:if={templateSelected}><div class="selection"><h3>{selectedTemplate.Name}</h3><p>{selectedTemplate.description}</p><lightning-button variant="brand" label="Start or resume this workout" onclick={begin} disabled={busy}></lightning-button></div></template>
            </section>
            <template lwc:if={hasRecent}><section class="panel"><span class="eyebrow">CONSISTENCY ADDS UP</span><h2>Recent workouts</h2><div class="history"><template for:each={recent} for:item="s"><button key={s.Id} class="history-row" data-id={s.Id} onclick={openSession} disabled={busy}><strong>{s.title}</strong><span>{s.subtitle}</span></button></template></div></section></template>
        </template>
        <template lwc:else>
            <div class="toolbar"><lightning-button label="Workout home" onclick={goHome} disabled={homeDisabled}></lightning-button><span>{summaryTitle}</span></div>
            <template lwc:if={completed}><section class="celebrate"><span class="eyebrow">YOU SHOWED UP</span><h2>Workout complete ✦</h2><p>{completedSets} sets performed · {skippedSets} sets skipped</p><p>Review your saved performance below.</p></section></template>
            <template lwc:if={hasCurrent}>
                <section class="panel"><div class="progress"><span>{progressText}</span><span>{session.Workout_Date__c}</span></div><lightning-progress-bar value={progressValue} size="small"></lightning-progress-bar>
                    <h2 class="exercise-name">{currentName}</h2><div class="target">{target}</div><p>{prescription}</p><p class="muted">Weight: {weightBasis}</p>
                    <template lwc:if={formNotes}><details><summary>Form tips</summary><p>{formNotes}</p></details></template><template lwc:if={videoUrl}><a href={videoUrl} target="_blank" rel="noopener noreferrer">Open exercise tutorial ↗</a></template>
                    <div class="previous"><div><span class="eyebrow">LAST TIME</span><template lwc:if={hasPrevious}><p>{previousDate}</p><template for:each={previousRows} for:item="p"><p key={p.Id}>{p.text}</p></template><p class="muted">{bestLabel}</p></template><template lwc:else><p>A fresh starting point. No comparable completed sets yet.</p></template></div>
                        <template lwc:if={hasPrevious}><template lwc:if={completed}></template><template lwc:else><lightning-button label="Use previous weights" onclick={copyWeights} disabled={busy}></lightning-button></template></template>
                    </div>
                    <template lwc:if={historyLimited}><p class="muted">History reached the review limit. This is not an all-time record calculation.</p></template>
                    <template lwc:if={showSuggestion}><div class="message success">Your previous comparable sets reached the current rep ceiling with good form recorded. Consider a small weight increase only if recovery and comfort agree. No weight is changed automatically.</div></template>
                    <div class="sets"><template for:each={setRows} for:item="s"><div key={s.Id} class="set-card"><h3>{s.title}</h3><div class="set-inputs"><lightning-input type="number" label="Weight (lb)" min="0" max="9999.99" step="0.01" value={s.Weight__c} data-id={s.Id} data-field="Weight__c" onchange={changeSet} disabled={s.disabled}></lightning-input><template lwc:if={isTimed}><lightning-input type="number" label="Seconds" min="0" max="99999999" step="1" value={s.Duration_Seconds__c} data-id={s.Id} data-field="Duration_Seconds__c" onchange={changeSet} disabled={s.disabled}></lightning-input></template><template lwc:else><lightning-input type="number" label="Reps" min="0" max="999" step="1" value={s.Reps__c} data-id={s.Id} data-field="Reps__c" onchange={changeSet} disabled={s.disabled}></lightning-input></template></div><lightning-input type="checkbox" label="Skip this set" checked={s.Skipped__c} data-id={s.Id} data-field="Skipped__c" onchange={changeSet} disabled={notesDisabled}></lightning-input></div></template></div>
                    <template lwc:if={completed}></template><template lwc:else><lightning-input type="checkbox" label="My performed sets felt comfortable and used good form" checked={current.Form_Confirmed__c} onchange={changeForm} disabled={busy}></lightning-input><p class="save-state" role="status">{savedLabel}</p><div class="actions"><lightning-button variant="brand" label="Save exercise" onclick={save} disabled={busy}></lightning-button><lightning-button label="Start rest timer" onclick={startRest} disabled={busy}></lightning-button><span class="timer" aria-label="Rest time remaining">{restLabel}</span><lightning-button label="Stop timer" onclick={stopRest}></lightning-button></div></template>
                    <div class="pager"><lightning-button label="Previous exercise" data-direction="-1" onclick={move} disabled={previousDisabled}></lightning-button><lightning-button label="Next exercise" data-direction="1" onclick={move} disabled={nextDisabled}></lightning-button></div>
                </section>
            </template>
            <section class="panel"><h2>Wrap up</h2><p>Every set needs reps or seconds, or an explicit skip. It is fine to finish with skipped sets.</p><lightning-textarea label="Workout notes" value={notes} onchange={changeNotes} disabled={notesDisabled}></lightning-textarea><lightning-input type="number" label="Workout duration (minutes, optional)" min="0" max="1440" step="1" value={minutes} onchange={changeMinutes} disabled={notesDisabled}></lightning-input><p class="muted">The suggested duration includes time away. Adjust it before finishing. Notes and duration save with Save exercise, navigation, or Finish workout.</p><template lwc:if={completed}></template><template lwc:else><lightning-button variant="brand" label="Finish workout" onclick={finish} disabled={busy}></lightning-button></template></section>
        </template>
    </section>
</template>
