<template>
    <section class="walking" aria-label="Progressive walking">
        <template lwc:if={busy}><lightning-spinner alternative-text="Loading or saving walking data" size="small"></lightning-spinner></template>
        <template lwc:if={error}><p class="error" role="alert">{error}</p></template>
        <template lwc:if={notice}><p class="notice" role="status">{notice}</p></template>
        <p class="unsaved" role="status">{unsavedText}</p>
        <template lwc:if={loaded}>
            <div class="intro"><div><h2>Build your walking rhythm</h2><p>{goalText}</p></div><lightning-input type="date" label="Review 7 days ending" value={windowEnd} max={data.today} onchange={changeWindow} disabled={busy}></lightning-input></div>
            <p class="muted">One primary goal: steps OR miles. The other metric is a reference, not an additional workload.</p>
            <div class="stats"><div><h3>Measured baseline</h3><p>{baselineText}</p><small>At least 5 recorded values in 7 completed days are needed for each metric. Zero is a recorded value; blanks are unknown.</small></div><div><h3>Weekly average</h3><p>{averageText}</p><p>{achievementText}</p><p>{streakText}</p></div></div>
            <p>{progressText}</p><lightning-progress-bar value={progressValue} size="small"></lightning-progress-bar>
            <details><summary>Historical Apple Health reference</summary><p>Previously supplied averages: 6,463 steps/day and 2.45 miles/day. Proposed starting goals: 7,500 steps OR 2.7 miles/day. Neighborhood route: 0.78 miles, approximately 2,050 steps.</p><p>These are historical reference values, not live readings or an established baseline from this tracker. Salesforce has no connection to ChatGPT Health. This version uses manual entry.</p></details>
            <div class="columns">
                <section class="box" data-section="day"><h3>Daily walking totals</h3><div class="fields"><lightning-input type="date" label="Activity date" value={day.activityDate} max={data.today} onchange={changeDate} disabled={busy} required></lightning-input><lightning-combobox label="Route reference" value={day.routeId} options={routeOptions} data-field="routeId" onchange={changeDay} disabled={busy}></lightning-combobox><lightning-input type="number" label="Daily steps" min="0" max="200000" step="1" value={day.steps} data-field="steps" onchange={changeDay} disabled={busy}></lightning-input><lightning-input type="number" label="Daily distance (miles)" min="0" max="200" step="0.01" value={day.miles} data-field="miles" onchange={changeDay} disabled={busy}></lightning-input><lightning-input type="number" label="Walking duration (minutes)" min="0" max="1440" step="1" value={day.minutes} data-field="minutes" onchange={changeDay} disabled={busy}></lightning-input><lightning-combobox label="Comfort" value={day.comfort} options={comforts} data-field="comfort" onchange={changeDay} disabled={busy}></lightning-combobox><lightning-combobox label="Fatigue" value={day.fatigue} options={fatigues} data-field="fatigue" onchange={changeDay} disabled={busy}></lightning-combobox><lightning-combobox label="Recovery" value={day.recovery} options={recoveries} data-field="recovery" onchange={changeDay} disabled={busy}></lightning-combobox></div>
                    <details><summary>Progression readiness checklist</summary><lightning-input type="checkbox" label="Current goal is being met comfortably most days" checked={day.goalComfortable} data-field="goalComfortable" onchange={changeDay} disabled={busy}></lightning-input><lightning-input type="checkbox" label="No unusual soreness or excessive fatigue" checked={day.noSoreness} data-field="noSoreness" onchange={changeDay} disabled={busy}></lightning-input><lightning-input type="checkbox" label="Walking remains enjoyable" checked={day.enjoyable} data-field="enjoyable" onchange={changeDay} disabled={busy}></lightning-input><lightning-input type="checkbox" label="Comfortable conversational effort is possible" checked={day.conversational} data-field="conversational" onchange={changeDay} disabled={busy}></lightning-input></details>
                    <lightning-textarea label="Optional walking notes" maxlength="4000" value={day.notes} data-field="notes" onchange={changeDay} disabled={busy}></lightning-textarea><p class="muted">Enter a daily total, not an additional walk. Saving the same date replaces its values. Route shortcuts never add estimated steps to totals.</p><lightning-button variant="brand" label="Save walking day" onclick={saveDaily} disabled={busy}></lightning-button>
                </section>
                <section class="box"><div class="intro"><h3>Weekly activity</h3><lightning-combobox label="Chart metric" value={metric} options={metrics} onchange={changeMetric} disabled={busy}></lightning-combobox></div><p class="muted">7 calendar days. Blank days stay unrecorded; averages use recorded values only. Goal status uses the primary metric saved for each day.</p><ul class="chart" aria-label="Daily activity chart"><template for:each={chartRows} for:item="r"><li key={r.key}><div class="bar-label"><span>{r.label}</span><strong>{r.value}</strong></div><div class="track"><div class="bar" style={r.style}></div></div><small>{r.status}</small></li></template></ul>
                    <h3>Recommended next step</h3><p class="recommendation">{recommendation}</p><template lwc:if={canSuggest}><lightning-button label="Prepare suggested increase" onclick={suggest} disabled={busy}></lightning-button></template>
                    <details><summary>Routes</summary><p class="muted">Choose a saved shortcut to reference a route. Daily totals remain manual.</p><div class="shortcuts"><template for:each={routes} for:item="r"><lightning-button key={r.Id} label={r.label} data-id={r.Id} onclick={routeShortcut} disabled={busy}></lightning-button></template></div><template lwc:if={routesLimited}><p>Only the first 500 routes are displayed. Use a report for additional routes.</p></template></details>
                </section>
            </div>
            <details class="box" data-section="goal"><summary>Edit goal and approve change</summary><p>Changes start today for newly recorded days. Existing days keep their original goal reference. History is append-only. An empty companion value means no reference target.</p><div class="fields"><lightning-combobox label="Primary goal metric" value={goal.metric} options={metrics} data-field="metric" onchange={changeGoal} disabled={busy} required></lightning-combobox><lightning-input type="number" label="Daily step goal or reference" min="0" max="200000" step="1" value={goal.steps} data-field="steps" onchange={changeGoal} disabled={busy}></lightning-input><lightning-input type="number" label="Daily distance goal or reference (miles)" min="0" max="200" step="0.01" value={goal.miles} data-field="miles" onchange={changeGoal} disabled={busy}></lightning-input><lightning-input label="Reason for goal change" maxlength="255" value={goal.reason} data-field="reason" onchange={changeGoal} disabled={busy} required></lightning-input></div><p class="muted">For comfortable progression, consider +1,000–3,000 steps OR +0.25–0.5 miles, changing only the primary metric. You may also hold or reduce a goal.</p><lightning-button variant="brand" label="Review and approve goal" onclick={saveGoal} disabled={busy}></lightning-button></details>
            <details class="box" data-section="route"><summary>Save or edit a route</summary><lightning-combobox label="Edit saved route, or choose No route to create one" options={routeOptions} value={route.id} onchange={editRoute} disabled={busy}></lightning-combobox><div class="fields"><lightning-input label="Route name" maxlength="255" value={route.name} data-field="name" onchange={changeRoute} disabled={busy} required></lightning-input><lightning-input type="number" label="Route distance (miles)" min="0" max="200" step="0.01" value={route.miles} data-field="miles" onchange={changeRoute} disabled={busy}></lightning-input><lightning-input type="number" label="Approximate route steps" min="0" max="200000" step="1" value={route.steps} data-field="steps" onchange={changeRoute} disabled={busy}></lightning-input><lightning-input type="checkbox" label="Show route shortcut" checked={route.active} data-field="active" onchange={changeRoute} disabled={busy}></lightning-input></div><lightning-textarea label="Route notes" maxlength="4000" value={route.notes} data-field="notes" onchange={changeRoute} disabled={busy}></lightning-textarea><div class="buttons"><lightning-button label="Fill neighborhood reference" onclick={neighborhood} disabled={busy}></lightning-button><lightning-button variant="brand" label="Save route" onclick={saveRouteEntry} disabled={busy}></lightning-button></div></details>
            <details class="box"><summary>Goal history</summary><template for:each={goalHistory} for:item="g"><article key={g.Id}><strong>{g.line}</strong><p>{g.Reason__c}</p><lightning-formatted-date-time value={g.Approved_At__c} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time><p class="muted">{g.baseline}</p></article></template></details>
            <details class="box"><summary>Recorded days in the selected week</summary><template for:each={dayHistory} for:item="d"><article key={d.Id}><strong>{d.label}</strong><p>{d.Comfort__c} · {d.Fatigue__c} fatigue · {d.Recovery__c}</p><p>{d.Notes__c}</p></article></template><p class="muted">Use Activity date to edit a day's total. Each review loads up to 400 preceding calendar days. Change the review date to inspect older history.</p></details>
        </template>
    </section>
</template>
